# Client auth for Postgres under compose.yaml (production). The db service points hba_file
# here, so how its data volume was first initialized never matters: a volume set up by the
# dev overrides, which trust everyone, still needs passwords here.
# TYPE  DATABASE  USER  ADDRESS  METHOD
# The socket is reachable only by `docker compose exec` into the db container.
local   all       all            trust
host    all       all   all      scram-sha-256
