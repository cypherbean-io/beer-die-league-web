services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: beerdie
      # Dev/test only: no password, and the port is bound to loopback. The production
      # setup (delivery slice 8) replaces this with a secret.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d beerdie']
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot: applies the committed migrations. Dev/test only: it runs the host checkout
  # (and its node_modules) read-only; delivery slice 8 switches it to the API image.
  migrate:
    image: node:26-alpine
    working_dir: /repo/apps/api
    command: ['node', 'src/db/migrate.ts']
    environment:
      DATABASE_URL: postgres://postgres@db:5432/beerdie
    volumes:
      - .:/repo:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
